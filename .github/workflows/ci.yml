name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet format --verify-no-changes

  build:
    name: build (${{ matrix.os }}, ${{ matrix.configuration }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # AgentTools is on in Debug and compiled out in Release, so both paths need to build.
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The pinned SDK builds; the tests also run on the lowest runtimes the library (8) and server (10) support.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c ${{ matrix.configuration }}
      - run: dotnet test -c ${{ matrix.configuration }} --no-build

  # The MCP server refuses a game on another minor version, so a change to the options it passes the game
  # needs a minor bump (see "Versions" in docs/design.md). This compares the library at the PR's base.
  command-line-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build the library here and at the base
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          dotnet build src/MonoGame.AgentTools -c Release
          dotnet build ../base/src/MonoGame.AgentTools -c Release
      - run: >-
          dotnet run tools/CommandLineContract.cs --
          ../base/artifacts/bin/MonoGame.AgentTools/release/MonoGame.AgentTools.dll
          artifacts/bin/MonoGame.AgentTools/release/MonoGame.AgentTools.dll

  pack:
    needs: [format, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Tags vX.Y.Z pack that version; other builds get VersionPrefix with a CI prerelease number.
      # Not named VERSION: MSBuild reads environment variables as properties, and that one would set $(Version).
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # The tag must match VersionPrefix, which sets the assembly version the MCP server checks.
            prefix=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
            if [[ "${GITHUB_REF_NAME#v}" != "$prefix" ]]; then echo "::error::Tag $GITHUB_REF_NAME doesn't match VersionPrefix $prefix"; exit 1; fi
            echo "PACK_VERSION=-p:PackageVersion=$prefix" >> "$GITHUB_ENV"
          else echo "PACK_VERSION=-p:VersionSuffix=ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"; fi
      - run: dotnet pack src/MonoGame.AgentTools -c Release -o out $PACK_VERSION -p:ContinuousIntegrationBuild=true
      - run: dotnet pack src/MonoGame.AgentTools.Mcp -c Release -o out $PACK_VERSION -p:ContinuousIntegrationBuild=true
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: out/*.nupkg
          if-no-files-found: error

  # A vX.Y.Z tag publishes both packages to nuget.org through trusted publishing: the job trades GitHub's
  # OIDC token for a short-lived API key, so the repository stores no key. Needs a trusted publishing
  # policy on nuget.org for this repository and ci.yml, and the NUGET_USER repository variable.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pack]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: packages
          path: out
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push "out/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
