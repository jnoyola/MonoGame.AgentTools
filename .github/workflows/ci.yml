name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet format --verify-no-changes

  build:
    name: build (${{ matrix.os }}, ${{ matrix.configuration }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # AgentTools is on in Debug and compiled out in Release, so both paths need to build.
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c ${{ matrix.configuration }}
      - run: dotnet test -c ${{ matrix.configuration }} --no-build

  pack:
    needs: [format, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Tags vX.Y.Z pack that version; other builds get a CI prerelease number.
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV";
          else echo "VERSION=0.1.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"; fi
      - run: dotnet pack src/MonoGame.AgentTools -c Release -o out -p:PackageVersion=$VERSION -p:ContinuousIntegrationBuild=true
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: out/*.nupkg
          if-no-files-found: error
