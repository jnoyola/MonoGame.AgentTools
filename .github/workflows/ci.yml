name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet format --verify-no-changes

  build:
    name: build (${{ matrix.os }}, ${{ matrix.configuration }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        # AgentTools is on in Debug and compiled out in Release, so both paths need to build.
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The pinned SDK builds; the tests also run on the lowest runtimes the library (8) and server (10) support.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build -c ${{ matrix.configuration }}
      - run: dotnet test -c ${{ matrix.configuration }} --no-build

  # The MCP server refuses a game on another minor version, so a change to the options it passes the game
  # needs a minor bump (see "Versions" in docs/design.md). This compares the library at the PR's base.
  command-line:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build the library here and at the base
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          dotnet build src/MonoGame.AgentTools -c Release
          dotnet build ../base/src/MonoGame.AgentTools -c Release
      - run: >-
          dotnet run tools/CheckCommandLine.cs --
          ../base/artifacts/bin/MonoGame.AgentTools/release/MonoGame.AgentTools.dll
          artifacts/bin/MonoGame.AgentTools/release/MonoGame.AgentTools.dll

  pack:
    needs: [format, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Tags vX.Y.Z pack that version; other builds get VersionPrefix with a CI prerelease number.
      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=-p:PackageVersion=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV";
          else echo "VERSION=-p:VersionSuffix=ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"; fi
      - run: dotnet pack src/MonoGame.AgentTools -c Release -o out $VERSION -p:ContinuousIntegrationBuild=true
      - run: dotnet pack src/MonoGame.AgentTools.Mcp -c Release -o out $VERSION -p:ContinuousIntegrationBuild=true
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: out/*.nupkg
          if-no-files-found: error
